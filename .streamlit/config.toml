[theme]
base = "dark"
font = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#88C0D0", "#81A1C1", "#5E81AC", "#A3BE8C", "#EBCB8B", "#D08770", "#B48EAD"]

[theme.light]
primaryColor = "#9B3A28"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#F1EEE8"
textColor = "#25231F"
borderColor = "#D7D1C7"
linkColor = "#8A3324"
blueColor = "#426B8A"
greenColor = "#3F7652"
orangeColor = "#9B5E2D"
redColor = "#A13C35"

[theme.dark]
primaryColor = "#88C0D0"
backgroundColor = "#2E3440"
secondaryBackgroundColor = "#3B4252"
textColor = "#ECEFF4"
borderColor = "#4C566A"
linkColor = "#8FBCBB"
blueColor = "#81A1C1"
greenColor = "#A3BE8C"
yellowColor = "#EBCB8B"
orangeColor = "#D08770"
redColor = "#BF616A"
violetColor = "#B48EAD"

[theme.light.sidebar]
backgroundColor = "#F1EEE8"
secondaryBackgroundColor = "#E7E2D9"
borderColor = "#D7D1C7"

[theme.dark.sidebar]
backgroundColor = "#3B4252"
secondaryBackgroundColor = "#434C5E"
borderColor = "#4C566A"

[client]
showErrorDetails = "none"
toolbarMode = "viewer"
