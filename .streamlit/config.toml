[theme]
base = "dark"
font = "sans-serif"
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#E3263E", "#FF6675", "#F59E0B", "#46B978", "#60A5FA", "#C084FC", "#A3A3A3"]

[theme.light]
primaryColor = "#B5162B"
backgroundColor = "#FFF9F9"
secondaryBackgroundColor = "#F6ECEE"
textColor = "#261719"
borderColor = "#E4CCD0"
linkColor = "#A91025"
blueColor = "#356E9A"
greenColor = "#2F7D4F"
orangeColor = "#A45B16"
redColor = "#B5162B"
violetColor = "#7A4EA3"

[theme.dark]
primaryColor = "#D91F36"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#171719"
textColor = "#F7F4F4"
borderColor = "#392327"
linkColor = "#FF6675"
blueColor = "#60A5FA"
greenColor = "#46B978"
yellowColor = "#F6C453"
orangeColor = "#F59E0B"
redColor = "#FF5A6A"
violetColor = "#C084FC"

[theme.light.sidebar]
backgroundColor = "#F6ECEE"
secondaryBackgroundColor = "#EEDFE2"
borderColor = "#E4CCD0"

[theme.dark.sidebar]
backgroundColor = "#111113"
secondaryBackgroundColor = "#1D1719"
borderColor = "#392327"

[client]
showErrorDetails = "none"
toolbarMode = "viewer"
